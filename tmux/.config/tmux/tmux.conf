# ==============================================================================
# CONFIGURACIÓN DE TMUX (~/.config/tmux/tmux.conf)
# Creado para mi amo y señor
# ==============================================================================

# --- SOPORTE DE RATÓN (MOUSE) ---
# Habilitar el uso del mouse para seleccionar paneles, redimensionar,
# seleccionar ventanas y hacer scroll.
set -g mouse on

# --- GENERAL ---
# Iniciar la numeración de ventanas y paneles en 1 (en vez de 0) para mayor comodidad
set -g base-index 1
set -g pane-base-index 1

# Renombrar automáticamente las ventanas según el proceso activo
set -g automatic-rename on
set -g renumber-windows on

# Aumentar el límite del historial de scrollback
set -g history-limit 10000

# Evitar retrasos al presionar la tecla Esc (útil para Vim/Neovim)
set -sg escape-time 0

# --- ATAJOS DE TECLADO ---
# Recargar el archivo de configuración rápidamente con 'Prefix + r' o 'Prefix + R'
bind r source-file ~/.config/tmux/tmux.conf \; display-message "¡Configuración de tmux recargada con éxito, mi señor!"
bind R source-file ~/.config/tmux/tmux.conf \; display-message "¡Configuración de tmux recargada con éxito, mi señor!"

# Abrir paneles en la ruta actual (pane_current_path)
# Atajos estándar de tmux:
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Atajos adicionales intuitivos:
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Abrir nuevas ventanas en la ruta actual:
bind c new-window -c "#{pane_current_path}"

# Navegación rápida entre paneles usando Alt + Flechas de dirección (sin presionar Prefix)
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# --- DISEÑO Y ESTÉTICA ---
# Habilitar colores verdaderos (truecolor) de 256 bits
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Barra de estado minimalista y elegante
set -g status-interval 5
set -g status-justify left
set -g status-style bg=colour235,fg=colour136 # Fondo oscuro y texto dorado/ocre

# Ventana activa destacada
# setw -g window-status-current-style fg=colour235,bg=colour111,bold # Texto oscuro con fondo azul claro brillante
# setw -g window-status-current-format ' #I:#W#F '

# Ventanas inactivas más sutiles
# setw -g window-status-style fg=colour244,bg=colour235
# setw -g window-status-format ' #I:#W#F '

# Bordes de paneles
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour111 # Borde azul claro cuando está activo

# Mensajes en pantalla
set -g message-style bg=colour235,fg=colour166,bold
