# ==============================================================================
# CONFIGURACIÓN MAESTRA DE TMUX (~/.config/tmux/tmux.conf)
# Creado y perfeccionado para mi amo y señor
# ==============================================================================

# --- SOPORTE DE RATÓN (MOUSE) ---
set -g mouse on

# --- GENERAL ---
# Numeración en 1 para ventanas y paneles
set -g base-index 1
set -g pane-base-index 1

# Renombrar automáticamente y reordenar ventanas al cerrar una
set -g automatic-rename on
set -g renumber-windows on

# Historial de scrollback generoso
set -g history-limit 10000

# Evitar retrasos de la tecla Esc (esencial para Vim/Neovim)
set -sg escape-time 0

# --- RECARGA DE CONFIGURACIÓN ---
# Recargar configuración con 'Prefix + r' o 'Prefix + R'
bind r source-file ~/.config/tmux/tmux.conf \; display-message "¡Configuración de tmux recargada con éxito, mi señor!"
bind R source-file ~/.config/tmux/tmux.conf \; display-message "¡Configuración de tmux recargada con éxito, mi señor!"

# --- MODO VI Y PORTAPAPELES (WAYLAND / WL-COPY) ---
# Habilitar modo Vi para navegar en el historial (Prefix + [)
setw -g mode-keys vi

# Protocolo OSC 52 para portapapeles
set -s set-clipboard on

# Atajos de copia estilo Vi integrados con el portapapeles del sistema (wl-copy)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Pegar directamente desde el portapapeles de Wayland con Prefix + P
bind P run "wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer"

# --- APERTURA DE PANELES Y VENTANAS EN RUTA ACTUAL ---
# Atajos estándar de tmux:
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Atajos intuitivos adicionales:
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Nuevas ventanas en la ruta actual:
bind c new-window -c "#{pane_current_path}"

# --- NAVEGACIÓN Y REDIMENSIONAMIENTO DE PANELES ---
# Navegación rápida con Alt + Flechas (sin presionar Prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Redimensionamiento ágil con Prefix + H, J, K, L (repetible sin soltar Prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- DISEÑO Y ESTÉTICA ---
# Habilitar truecolor de 256 bits
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Barra de estado minimalista y elegante
set -g status-interval 5
set -g status-justify left
set -g status-style bg=colour235,fg=colour136 # Fondo oscuro y texto dorado/ocre

# Ventana activa destacada
setw -g window-status-current-style fg=colour235,bg=colour111,bold # Fondo azul claro con texto oscuro
setw -g window-status-current-format ' #I:#W#F '

# Ventanas inactivas sutiles
setw -g window-status-style fg=colour244,bg=colour235
setw -g window-status-format ' #I:#W#F '

# Bordes de paneles
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour111 # Borde azul claro al estar activo

# Mensajes en pantalla
set -g message-style bg=colour235,fg=colour166,bold

# --- PERSISTENCIA DE SESIONES (TPM & RESURRECT) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restaurar contenido interno de los paneles y procesos
set -g @resurrect-capture-pane-contents 'on'

# Autoguardado periódico cada 15 minutos y autorestaura al iniciar tmux
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Inicializar TMUX plugin manager (debe permanecer al final del archivo)
run '~/.tmux/plugins/tpm/tpm'
