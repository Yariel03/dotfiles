# Configuración de Hyprlock creada para mi amo y señor yariel

background {
    monitor =
    path = screenshot          # Toma una captura de pantalla y la difumina
    blur_passes = 3            # Efecto de difuminado (blur)
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.5           # Oscurece un poco el fondo
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Campo de entrada de contraseña
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)   # Sin borde exterior rígido
    inner_color = rgba(255, 255, 255, 0.1) # Transparente premium (glassmorphism)
    font_color = rgb(242, 243, 244)
    fade_on_empty = false
    font_family = Sans
    placeholder_text = <i>Introduce tu contraseña...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# Reloj grande en la parte superior
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(255, 255, 255, 0.85)
    font_size = 90
    font_family = Sans Bold
    position = 0, -200
    halign = center
    valign = top
}

# Mensaje de bienvenida personalizado
label {
    monitor =
    text = Hola de nuevo, $USER
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = Sans
    position = 0, -40
    halign = center
    valign = center
}
