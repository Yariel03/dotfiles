[manager]
show_hidden = true

[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Edit" },
]

[open]
rules = [
	{ mime = "text/*", use = [ "edit" ] },
	{ mime = "application/json", use = [ "edit" ] },
	{ mime = "application/javascript", use = [ "edit" ] },
	{ url = "*.txt", use = [ "edit" ] },
	{ url = "*.md", use = [ "edit" ] },
	{ url = "*.json", use = [ "edit" ] },
	{ url = "*.js", use = [ "edit" ] },
	{ url = "*.ts", use = [ "edit" ] },
	{ url = "*.py", use = [ "edit" ] },
	{ url = "*.sh", use = [ "edit" ] },
	{ url = "*.toml", use = [ "edit" ] },
	{ url = "*.yaml", use = [ "edit" ] },
	{ url = "*.yml", use = [ "edit" ] },
]
